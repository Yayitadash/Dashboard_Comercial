<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Hábitos">
<title>Mis Hábitos 🌸</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --pink: #c06090; --pink-light: #f4d0e0;
    --green: #3cb37a; --amber: #e8a020; --red: #e05070; --blue: #3b8ad4;
    --surface: #fff; --surface1: #f9f4f7; --surface2: #f2eaf0;
    --text: #2a1a24; --text2: #7a5a6a; --text3: #b09aaa;
    --border: rgba(192,96,144,0.15); --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1e1318; --surface1: #271820; --surface2: #301e28;
      --text: #f0e0e8; --text2: #c09aaa; --text3: #806070;
      --border: rgba(192,96,144,0.2);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--surface1); color: var(--text); min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; padding: 0 0 80px; }
  .hero { background: linear-gradient(135deg, #d47fa6, #c06090); padding: 1.4rem 1rem 1.1rem; text-align: center; color: white; }
  .hero h1 { font-size: 22px; font-weight: 600; margin: 6px 0 2px; }
  .hero-tagline { font-size: 11px; opacity: 0.75; font-style: italic; margin-bottom: 4px; letter-spacing: 0.02em; }
  .hero-profile { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 6px 0 4px; }
  .hero-profile-name { color: rgba(255,255,255,0.9); font-size: 13px; }
  .hero-profile-btn { background: rgba(255,255,255,0.2); border: none; color: white; font-size: 11px; padding: 3px 10px; border-radius: 20px; cursor: pointer; }
  .hero-lang { display: flex; gap: 6px; justify-content: center; margin-top: 4px; }
  .lang-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; font-size: 12px; padding: 2px 10px; border-radius: 20px; cursor: pointer; transition: background 0.15s; }
  .lang-btn.active { background: rgba(255,255,255,0.35); font-weight: 600; }
  .hero p { font-size: 13px; opacity: 0.85; margin-top: 2px; }
  .bottom-tabs { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 100; max-width: 480px; margin: 0 auto; }
  .btab { flex: 1; padding: 10px 0 12px; text-align: center; cursor: pointer; font-size: 11px; color: var(--text3); transition: color 0.15s; }
  .btab .btab-icon { font-size: 22px; display: block; margin-bottom: 2px; }
  .btab.active { color: var(--pink); }
  .week-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .week-nav button { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; cursor: pointer; color: var(--text2); font-size: 13px; }
  .week-title { font-size: 14px; font-weight: 500; color: var(--text); }
  .section-label { font-size: 11px; font-weight: 600; color: var(--pink); letter-spacing: 0.07em; text-transform: uppercase; padding: 14px 16px 6px; }
  .habits-block { background: var(--surface); margin: 0 12px 2px; border-radius: var(--radius); overflow: hidden; }
  .habit-row { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); gap: 8px; }
  .habit-row:last-child { border-bottom: none; }
  .habit-name { font-size: 13px; color: var(--text); flex: 1; line-height: 1.3; }
  .habit-emoji { font-size: 16px; width: 24px; flex-shrink: 0; }
  .week-cells { display: flex; gap: 5px; flex-shrink: 0; }
  .cell { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface1); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text3); transition: all 0.12s; user-select: none; flex-shrink: 0; }
  .cell.done { background: var(--green); border-color: var(--green); color: white; font-size: 12px; }
  .cell.fail { background: #f5eaee; border-color: #e0c0cc; color: #c08090; }
  @media (prefers-color-scheme: dark) { .cell.fail { background: #2e1a22; border-color: #5a3040; color: #9a6070; } }
  .prayer-cell { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface1); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--text3); transition: all 0.12s; user-select: none; flex-shrink: 0; }
  .prayer-cell.yes { background: var(--green); border-color: var(--green); color: white; }
  .prayer-cell.no  { background: #f5eaee; border-color: #e0c0cc; color: #c08090; }
  @media (prefers-color-scheme: dark) { .prayer-cell.no { background: #2e1a22; border-color: #5a3040; color: #9a6070; } }
  .day-header-row { display: flex; align-items: center; padding: 0 14px 4px; gap: 8px; }
  .day-header-spacer { flex: 1; }
  .day-header-cells { display: flex; gap: 5px; }
  .day-hdr { width: 28px; text-align: center; font-size: 10px; color: var(--text3); font-weight: 500; }
  .card { background: var(--surface); margin: 0 12px 12px; border-radius: var(--radius); padding: 14px; }
  .card-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
  .water-day-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .water-day-lbl { font-size: 12px; color: var(--text3); width: 26px; text-align: right; flex-shrink: 0; }
  .water-cups { display: flex; gap: 6px; }
  .water-cup { width: 32px; height: 32px; border-radius: 6px; border: 1.5px solid var(--border); background: var(--surface1); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.12s; flex-shrink: 0; }
  .water-cup.filled { background: var(--blue); border-color: var(--blue); }
  .water-oz { font-size: 11px; color: var(--text3); margin-left: 4px; }
  .stress-day-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .stress-day-lbl { font-size: 12px; color: var(--text3); width: 26px; text-align: right; flex-shrink: 0; }
  .stress-btns { display: flex; gap: 6px; }
  .stress-btn { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface1); cursor: pointer; font-size: 13px; color: var(--text2); transition: all 0.12s; font-weight: 500; }
  .stress-btn.sel { background: var(--pink); border-color: var(--pink); color: white; }
  .stress-word { font-size: 11px; color: var(--text3); margin-left: 2px; }
  .meal-row { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); gap: 8px; }
  .meal-row:last-child { border-bottom: none; }
  .meal-name { font-size: 13px; color: var(--text); flex: 1; line-height: 1.3; }
  .meal-emoji { font-size: 16px; width: 24px; flex-shrink: 0; }
  .meal-cells { display: flex; gap: 5px; flex-shrink: 0; }
  .meal-cell { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface1); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all 0.12s; user-select: none; flex-shrink: 0; }
  .meal-cell.red    { background: #f4cdd6; border-color: var(--red); }
  .meal-cell.yellow { background: #fbe6c4; border-color: var(--amber); }
  .meal-cell.green  { background: #c9eed9; border-color: var(--green); }
  @media (prefers-color-scheme: dark) {
    .meal-cell.red { background: #4a2028; } .meal-cell.yellow { background: #4a3a18; } .meal-cell.green { background: #1a3328; }
  }
  .legend-row { display: flex; gap: 14px; padding: 0 14px 12px; font-size: 11px; color: var(--text3); flex-wrap: wrap; }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 12px 12px; }
  .metric { background: var(--surface); border-radius: var(--radius); padding: 14px 12px; text-align: center; }
  .metric-val { font-size: 26px; font-weight: 600; color: var(--pink); }
  .metric-lbl { font-size: 11px; color: var(--text3); margin-top: 3px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bar-lbl { font-size: 12px; color: var(--text2); width: 56px; flex-shrink: 0; }
  .bar-track { flex: 1; height: 10px; background: var(--surface1); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 5px; transition: width 0.4s; }
  .bar-pct { font-size: 11px; color: var(--text3); width: 32px; text-align: right; flex-shrink: 0; }
  .hbar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .hbar-lbl { font-size: 11px; color: var(--text2); width: 140px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  .hbar-track { flex: 1; height: 9px; background: var(--surface1); border-radius: 5px; overflow: hidden; }
  .hbar-fill { height: 100%; border-radius: 5px; transition: width 0.4s; }
  .hbar-pct { font-size: 11px; color: var(--text3); width: 30px; text-align: right; flex-shrink: 0; }
  .pillar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .pillar-lbl { font-size: 12px; color: var(--text2); width: 150px; flex-shrink: 0; text-align: right; line-height: 1.3; }
  .pillar-track { flex: 1; height: 11px; background: var(--surface1); border-radius: 6px; overflow: hidden; }
  .pillar-fill { height: 100%; border-radius: 6px; transition: width 0.5s; }
  .pillar-pct { font-size: 11px; color: var(--text3); width: 34px; text-align: right; flex-shrink: 0; font-weight: 500; }
  .meal-bd-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .meal-bd-lbl { font-size: 12px; color: var(--text2); width: 70px; flex-shrink: 0; }
  .meal-bd-track { flex: 1; height: 14px; border-radius: 7px; overflow: hidden; display: flex; background: var(--surface1); }
  .meal-bd-seg { height: 100%; }
  .insight-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 0 12px 12px; }
  .insight-card { border-radius: var(--radius); padding: 12px 8px; text-align: center; }
  .insight-card.green { background: #eaf8f0; border: 1px solid #b2dfc6; }
  .insight-card.pink  { background: #fde8ef; border: 1px solid #f4b8cc; }
  .insight-card.gold  { background: #fef5e0; border: 1px solid #f0d080; }
  @media (prefers-color-scheme: dark) {
    .insight-card.green { background: #1a3328; border-color: #2d6048; }
    .insight-card.pink  { background: #3a1a24; border-color: #7a3050; }
    .insight-card.gold  { background: #3a2e10; border-color: #806020; }
  }
  .ic-emoji { font-size: 22px; margin-bottom: 5px; }
  .ic-lbl { font-size: 10px; color: var(--text3); margin-bottom: 3px; }
  .ic-val { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .chart-wrap { position: relative; width: 100%; }
  .chart-note { font-size: 11px; color: var(--text3); text-align: center; margin-top: 6px; }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--green); color: white; padding: 10px 22px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .save-btn { display: block; margin: 12px 12px 0; width: calc(100% - 24px); padding: 14px; background: var(--pink); color: white; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; }
  .install-banner { background: #fff8f0; border: 1px solid #f0d080; border-radius: var(--radius); margin: 12px 12px 0; padding: 12px 14px; font-size: 12px; color: #7a5a20; line-height: 1.5; }
  .install-banner strong { display: block; margin-bottom: 4px; font-size: 13px; }
  .install-close { float: right; cursor: pointer; font-size: 16px; color: #b09060; margin-top: -2px; }
  @media (prefers-color-scheme: dark) {
    .install-banner { background: #2e2510; border-color: #6a5010; color: #d0a060; }
    .install-close { color: #a08040; }
  }
  .profile-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #d47fa6, #c06090); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; padding: 2rem; }
  .profile-screen h2 { color: white; font-size: 24px; font-weight: 600; margin: 12px 0 4px; }
  .profile-screen .ps-tagline { color: rgba(255,255,255,0.7); font-size: 11px; font-style: italic; margin-bottom: 6px; }
  .profile-screen p { color: rgba(255,255,255,0.85); font-size: 14px; margin-bottom: 24px; text-align: center; }
  .profile-list { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .profile-btn { width: 100%; padding: 14px 18px; background: rgba(255,255,255,0.22); border: 1.5px solid rgba(255,255,255,0.4); border-radius: var(--radius); color: white; font-size: 15px; font-weight: 500; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; transition: background 0.15s; }
  .profile-btn:hover { background: rgba(255,255,255,0.32); }
  .profile-btn .pb-avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .profile-new { width: 100%; max-width: 340px; display: flex; gap: 8px; }
  .profile-new input { flex: 1; padding: 12px 14px; border-radius: var(--radius); border: 1.5px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.15); color: white; font-size: 14px; outline: none; }
  .profile-new input::placeholder { color: rgba(255,255,255,0.6); }
  .profile-new button { padding: 12px 16px; background: white; color: var(--pink); border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
  .ps-lang { display: flex; gap: 8px; margin-bottom: 20px; }
  .ps-lang button { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 4px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; }
  .ps-lang button.active { background: rgba(255,255,255,0.4); font-weight: 600; }
</style>
</head>
<body>

<!-- PROFILE SCREEN -->
<div id="profile-screen" class="profile-screen">
  <div style="font-size:48px;">🌸</div>
  <h2 id="ps-title">Mis Hábitos</h2>
  <div class="ps-tagline" id="ps-tagline">Cultivando hábitos para una vida saludable</div>
  <div class="ps-lang" id="ps-lang-btns"></div>
  <p id="ps-who">¿Quién eres tú?</p>
  <div class="profile-list" id="profile-list"></div>
  <div id="ps-create-section" style="width:100%;max-width:340px;">
    <div id="ps-or-divider" style="display:none;text-align:center;color:rgba(255,255,255,0.5);font-size:12px;margin-bottom:12px;">─── o crear nuevo ───</div>
    <div class="profile-new">
      <input type="text" id="profile-input" maxlength="20" onkeydown="if(event.key==='Enter')createProfile()">
      <button id="ps-create-btn" onclick="createProfile()">+ Crear</button>
    </div>
  </div>
</div>

<div class="app">
  <div class="hero">
    <div style="font-size:30px;">🌸</div>
    <h1 id="hero-title">Mis Hábitos</h1>
    <div class="hero-tagline" id="hero-tagline">Cultivando hábitos para una vida saludable</div>
    <div class="hero-profile">
      <span class="hero-profile-name" id="hero-name"></span>
      <button class="hero-profile-btn" id="hero-change-btn" onclick="showProfileScreen()">Cambiar</button>
    </div>
    <div class="hero-lang" id="hero-lang-btns"></div>
    <p id="week-subtitle" style="margin-top:2px;"></p>
  </div>

  <!-- REGISTRO -->
  <div id="tab-registro">
    <div id="install-banner" class="install-banner" style="display:none;">
      <span class="install-close" onclick="document.getElementById('install-banner').style.display='none'">✕</span>
      <strong id="install-title"></strong>
      <span id="install-msg"></span>
    </div>
    <div class="week-nav">
      <button id="btn-prev" onclick="changeWeek(-1)"></button>
      <div class="week-title" id="week-title-reg">—</div>
      <button id="btn-next" onclick="changeWeek(1)"></button>
    </div>
    <div class="day-header-row">
      <div class="day-header-spacer" style="flex:1;padding-left:32px;"></div>
      <div class="day-header-cells" id="day-headers"></div>
    </div>
    <div class="section-label" id="lbl-manana"></div>
    <div class="habits-block" id="habits-manana"></div>
    <div class="section-label" id="lbl-dia"></div>
    <div class="habits-block" id="habits-dia"></div>
    <div class="section-label" id="lbl-noche"></div>
    <div class="habits-block" id="habits-noche"></div>
    <div class="section-label" id="lbl-comidas"></div>
    <div class="habits-block" id="meals-rows"></div>
    <div class="legend-row" id="legend-row"></div>
    <div class="section-label" id="lbl-agua"></div>
    <div class="card"><div id="water-rows"></div></div>
    <div class="section-label" id="lbl-estres"></div>
    <div class="card"><div id="stress-rows"></div></div>
    <button class="save-btn" id="save-btn" onclick="saveData()"></button>
    <div style="height:8px;"></div>
  </div>

  <!-- GRÁFICAS -->
  <div id="tab-graficas" style="display:none;">
    <div class="week-nav">
      <button id="btn-prev-g" onclick="changeWeek(-1)"></button>
      <div class="week-title" id="week-title-graf">—</div>
      <button id="btn-next-g" onclick="changeWeek(1)"></button>
    </div>
    <div style="height:12px;"></div>
    <div class="metric-grid" id="metric-cards"></div>
    <div class="card">
      <div class="card-title" id="ct-daily"></div>
      <div id="daily-bars"></div>
    </div>
    <div class="card">
      <div class="card-title" id="ct-habit"></div>
      <div id="habit-bars"></div>
    </div>
    <div class="card">
      <div class="card-title" id="ct-pillars"></div>
      <div id="pillar-bars"></div>
    </div>
    <div class="card">
      <div class="card-title" id="ct-water"></div>
      <div class="chart-wrap" style="height:160px;"><canvas id="water-chart"></canvas></div>
      <div class="chart-note" id="water-note"></div>
    </div>
    <div class="card">
      <div class="card-title" id="ct-stress"></div>
      <div class="chart-wrap" style="height:160px;"><canvas id="stress-chart"></canvas></div>
      <div class="chart-note" id="stress-note"></div>
    </div>
    <div class="card">
      <div class="card-title" id="ct-meals"></div>
      <div id="meals-breakdown"></div>
      <div class="chart-note" id="meals-note"></div>
    </div>
    <div class="insight-grid" id="insight-cards"></div>
  </div>
</div>

<div class="bottom-tabs">
  <div class="btab active" id="btab-registro" onclick="showTab('registro')">
    <span class="btab-icon">📋</span><span id="tab-lbl-registro"></span>
  </div>
  <div class="btab" id="btab-graficas" onclick="showTab('graficas')">
    <span class="btab-icon">📊</span><span id="tab-lbl-graficas"></span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
// i18n — TRANSLATIONS
// ══════════════════════════════════════════════
const T = {
  es: {
    appName: 'Mis Hábitos',
    tagline: 'Cultivando hábitos para una vida saludable',
    whoAreYou: '¿Quién eres tú?',
    create: '+ Crear',
    namePlaceholder: 'Tu nombre...',
    change: 'Cambiar',
    save: 'Guardar ✓',
    saved: '✓ Guardado en tu teléfono',
    prev: '← Anterior',
    next: 'Siguiente →',
    weekOf: (a,b,mo) => `${a} al ${b} de ${mo}`,
    weekSubtitle: (r) => `Semana del ${r}`,
    tabRegistro: 'Registro',
    tabGraficas: 'Gráficas',
    secManana: '☀️ Mañana',
    secDia: '🌤 Durante el día',
    secNoche: '🌙 Noche',
    secComidas: '🚦 Calidad de comidas',
    secAgua: '💧 Agua (vasos de 20 oz)',
    secEstres: '😌 Nivel de estrés',
    legendBad: 'Comida basura',
    legendOk: 'Más o menos',
    legendGood: 'Saludable',
    si: 'Sí', no: 'No',
    stressLevels: ['sin estrés','leve','moderado','alto'],
    stressEmojis: ['😌','🙂','😐','😰'],
    installTitle: '📱 Agregar a tu pantalla de inicio',
    installMsg: 'En Safari: toca el botón compartir (⬆️) → "Agregar a pantalla de inicio". ¡Así funciona como app!',
    profileExists: 'Ya existe un perfil con ese nombre.',
    ctDaily: '📅 Cumplimiento diario (%)',
    ctHabit: '✅ Por hábito (%)',

let lang = 'es';
function t() { return T[lang]; }

function detectLang() {
  const saved = localStorage.getItem('habitos_lang');
  if(saved && T[saved]) return saved;
  const nav = navigator.language || '';
  if(nav.startsWith('it')) return 'it';
  if(nav.startsWith('en')) return 'en';
  return 'es';
}
function setLang(code) {
  lang = code;
  localStorage.setItem('habitos_lang', code);
  applyLang();
}
function applyLang() {
  const l = t();
  // meta
  document.title = l.appName + ' 🌸';
  // hero
  document.getElementById('hero-title').textContent = l.appName;
  document.getElementById('hero-tagline').textContent = l.tagline;
  document.getElementById('hero-change-btn').textContent = l.change;
  // profile screen
  document.getElementById('ps-title').textContent = l.appName;
  document.getElementById('ps-tagline').textContent = l.tagline;
  document.getElementById('ps-who').textContent = l.whoAreYou;
  document.getElementById('ps-create-btn').textContent = l.create;
  document.getElementById('profile-input').placeholder = l.namePlaceholder;
  // tabs
  document.getElementById('tab-lbl-registro').textContent = l.tabRegistro;
  document.getElementById('tab-lbl-graficas').textContent = l.tabGraficas;
  // section labels
  document.getElementById('lbl-manana').textContent = l.secManana;
  document.getElementById('lbl-dia').textContent = l.secDia;
  document.getElementById('lbl-noche').textContent = l.secNoche;
  document.getElementById('lbl-comidas').textContent = l.secComidas;
  document.getElementById('lbl-agua').textContent = l.secAgua;
  document.getElementById('lbl-estres').textContent = l.secEstres;
  // buttons
  document.getElementById('save-btn').textContent = l.save;
  ['btn-prev','btn-prev-g'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=l.prev; });
  ['btn-next','btn-next-g'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=l.next; });
  // chart titles
  document.getElementById('ct-daily').textContent = l.ctDaily;
  document.getElementById('ct-habit').textContent = l.ctHabit;
  document.getElementById('ct-pillars').textContent = l.ctPillars;
  document.getElementById('ct-water').textContent = l.ctWater;
  document.getElementById('ct-stress').textContent = l.ctStress;
  document.getElementById('ct-meals').textContent = l.ctMeals;
  // install
  const ib = document.getElementById('install-title');
  const im = document.getElementById('install-msg');
  if(ib) ib.textContent = l.installTitle;
  if(im) im.textContent = l.installMsg;
  // legend
  const lr = document.getElementById('legend-row');
  if(lr) lr.innerHTML = `
    <span><span class="legend-dot" style="background:var(--red);"></span>${l.legendBad}</span>
    <span><span class="legend-dot" style="background:var(--amber);"></span>${l.legendOk}</span>
    <span><span class="legend-dot" style="background:var(--green);"></span>${l.legendGood}</span>
  `;
  // lang buttons
  renderLangBtns();
  // re-render dynamic content
  if(currentMonday && state && state.habits) {
    const range = formatWeekRange(currentMonday);
    document.getElementById('week-subtitle').textContent = l.weekSubtitle(range);
    document.getElementById('week-title-reg').textContent = range;
    document.getElementById('week-title-graf').textContent = range;
    renderDayHeaders();
    renderHabits();
    renderMeals();
    renderWater();
    renderStress();
    const enGraficas = document.getElementById('tab-graficas').style.display !== 'none';
    if(enGraficas) setTimeout(renderCharts, 50);
  } else {
    renderDayHeaders();
  }
}

function renderLangBtns() {
  ['hero-lang-btns','ps-lang-btns'].forEach(id => {
    const c = document.getElementById(id);
    if(!c) return;
    c.innerHTML = '';
    LANGS.forEach(l2 => {
      const btn = document.createElement('button');
      btn.className = (id==='ps-lang-btns'?'':' ') + 'lang-btn' + (l2.code===lang?' active':'');
      btn.textContent = l2.flag + ' ' + l2.label;
      btn.onclick = () => setLang(l2.code);
      if(id==='ps-lang-btns') btn.style.cssText='background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:white;padding:4px 14px;border-radius:20px;font-size:13px;cursor:pointer;';
      c.appendChild(btn);
    });
  });
}

const AVATARS = ['🌸','🌺','🌼','🌻','💐','🍀','🌷','✨'];

// ── Profile system ──────────────────────────────────────
function getProfiles() { return JSON.parse(localStorage.getItem('habitos_profiles')||'[]'); }
function saveProfiles(p) { localStorage.setItem('habitos_profiles',JSON.stringify(p)); }
function showProfileScreen() {
  document.getElementById('profile-screen').style.display='flex';
  renderProfileList();
  renderLangBtns();
}
function hideProfileScreen() { document.getElementById('profile-screen').style.display='none'; }
function renderProfileList() {
  const list=document.getElementById('profile-list'); list.innerHTML='';
  const profiles=getProfiles();
  const divider=document.getElementById('ps-or-divider');
  if(profiles.length>0){
    if(divider) divider.style.display='block';
    profiles.forEach(p=>{
      const btn=document.createElement('button'); btn.className='profile-btn';
      btn.innerHTML=`<div class="pb-avatar">${p.avatar}</div><span>${p.name}</span>`;
      btn.onclick=()=>selectProfile(p); list.appendChild(btn);
    });
  } else {
    if(divider) divider.style.display='none';
    // Show all localStorage keys that look like profiles as fallback
    const fallbackNames = [];
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(key && key.startsWith('habitos_week_')){
        const name = key.replace('habitos_week_','').split('_2')[0].replace(/_/g,' ');
        if(name && !fallbackNames.includes(name)) fallbackNames.push(name);
      }
    }
    fallbackNames.forEach(name=>{
      const avatar=AVATARS[0];
      const btn=document.createElement('button'); btn.className='profile-btn';
      btn.innerHTML=`<div class="pb-avatar">${avatar}</div><span style="text-transform:capitalize">${name}</span>`;
      const profile={name:name.charAt(0).toUpperCase()+name.slice(1), avatar};
      btn.onclick=()=>selectProfile(profile);
      list.appendChild(btn);
      if(divider) divider.style.display='block';
    });
  }
}
function createProfile() {
  const input=document.getElementById('profile-input');
  const name=input.value.trim(); if(!name) return;
  const profiles=getProfiles();
  if(profiles.find(p=>p.name.toLowerCase()===name.toLowerCase())){ alert(t().profileExists); return; }
  const avatar=AVATARS[profiles.length%AVATARS.length];
  const profile={name,avatar}; profiles.push(profile); saveProfiles(profiles);
  input.value=''; selectProfile(profile);
}
function selectProfile(profile) {
  currentProfile=profile;
  document.getElementById('hero-name').textContent=profile.avatar+' '+profile.name;
  hideProfileScreen(); loadWeek(currentMonday);
}

// ── Date helpers ─────────────────────────────────────────
function getMondayOf(date) {
  const d=new Date(date),day=d.getDay();
  d.setDate(d.getDate()+(day===0?-6:1-day)); d.setHours(0,0,0,0); return d;
}
function weekKey(m) { return m.toISOString().slice(0,10); }
function formatWeekRange(m) {
  const sun=new Date(m); sun.setDate(sun.getDate()+6);
  const mo=t().months;
  return t().weekOf(m.getDate(), sun.getDate(), mo[sun.getMonth()]);
}
function storageKey(m) {
  const p=currentProfile?'_'+currentProfile.name.toLowerCase().replace(/\s+/g,'_'):'';
  return 'habitos_week'+p+'_'+weekKey(m);
}

// ── State ────────────────────────────────────────────────
function loadWeek(m) {
  const saved=localStorage.getItem(storageKey(m));
  state=saved?JSON.parse(saved):initState();
  if(!state.meals){ state.meals={}; MEAL_DEFS.forEach(mm=>{state.meals[mm.id]=Array(7).fill(null);}); }
  render();
}
function initState() {
  const s={habits:{},water:{},stress:{},meals:{}};
  ALL_HABIT_DEFS.forEach(h=>{s.habits[h.id]=Array(7).fill(null);});
  MEAL_DEFS.forEach(m=>{s.meals[m.id]=Array(7).fill(null);});
  for(let i=0;i<7;i++){s.water[i]=0;s.stress[i]=null;}
  return s;
}
function autoSave() { localStorage.setItem(storageKey(currentMonday),JSON.stringify(state)); }
function saveData() { autoSave(); showToast(t().saved); }
function showToast(msg) {
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

// ── Navigation ───────────────────────────────────────────
function showTab(name) {
  document.getElementById('tab-registro').style.display=name==='registro'?'':'none';
  document.getElementById('tab-graficas').style.display=name==='graficas'?'':'none';
  document.getElementById('btab-registro').classList.toggle('active',name==='registro');
  document.getElementById('btab-graficas').classList.toggle('active',name==='graficas');
  if(name==='graficas') setTimeout(renderCharts,50);
}
function changeWeek(dir) {
  currentMonday=new Date(currentMonday);
  currentMonday.setDate(currentMonday.getDate()+dir*7);
  loadWeek(currentMonday);
  const enGraficas=document.getElementById('tab-graficas').style.display!=='none';
  if(enGraficas) setTimeout(renderCharts,50);
}

// ── Toggle handlers ──────────────────────────────────────
function toggleHabit(id,di) {
  const cur=state.habits[id][di];
  state.habits[id][di]=cur===null?true:cur===true?false:null;
  renderHabits(); autoSave();
}
function togglePrayer(di) {
  const cur=state.habits['oracion'][di];
  state.habits['oracion'][di]=cur===null?true:cur===true?false:null;
  renderHabits(); autoSave();
}
function toggleMeal(mealId,di) {
  const order=[null,'red','yellow','green'];
  const cur=state.meals[mealId][di];
  state.meals[mealId][di]=order[(order.indexOf(cur)+1)%order.length];
  renderMeals(); autoSave();
}

// ── Render helpers ───────────────────────────────────────
function renderDayHeaders() {
  const c=document.getElementById('day-headers'); c.innerHTML='';
  t().daysShort.forEach(d=>{const el=document.createElement('div');el.className='day-hdr';el.textContent=d;c.appendChild(el);});
}

function renderHabitSection(cid, defs) {
  const c=document.getElementById(cid); if(!c) return; c.innerHTML='';
  defs.forEach(h=>{
    const l=t(); const name=l.habits[h.id]||h.id;
    const row=document.createElement('div'); row.className='habit-row';
    const em=document.createElement('div'); em.className='habit-emoji'; em.textContent=h.emoji;
    const nm=document.createElement('div'); nm.className='habit-name'; nm.textContent=name;
    const cells=document.createElement('div'); cells.className='week-cells';
    for(let i=0;i<7;i++){
      const val=(state.habits[h.id]||[])[i]??null;
      if(h.type==='prayer'){
        const cell=document.createElement('div');
        cell.className='prayer-cell'+(val===true?' yes':val===false?' no':'');
        cell.textContent=val===true?l.si:val===false?l.no:'';
        const di=i; cell.onclick=()=>togglePrayer(di); cells.appendChild(cell);
      } else {
        const cell=document.createElement('div');
        cell.className='cell'+(val===true?' done':val===false?' fail':'');
        cell.textContent=val===true?'✓':val===false?'✗':'';
        const di=i,hi=h.id; cell.onclick=()=>toggleHabit(hi,di); cells.appendChild(cell);
      }
    }
    row.appendChild(em); row.appendChild(nm); row.appendChild(cells); c.appendChild(row);
  });
}
function renderHabits() {
  renderHabitSection('habits-manana',HABIT_DEFS.manana);
  renderHabitSection('habits-dia',HABIT_DEFS.dia);
  renderHabitSection('habits-noche',HABIT_DEFS.noche);
}
function renderMeals() {
  const c=document.getElementById('meals-rows'); if(!c) return; c.innerHTML='';
  const l=t();
  MEAL_DEFS.forEach(m=>{
    const name=l.meals[m.id]||m.id;
    const row=document.createElement('div'); row.className='meal-row';
    const em=document.createElement('div'); em.className='meal-emoji'; em.textContent=m.emoji;
    const nm=document.createElement('div'); nm.className='meal-name'; nm.textContent=name;
    const cells=document.createElement('div'); cells.className='meal-cells';
    for(let i=0;i<7;i++){
      const val=(state.meals[m.id]||[])[i]??null;
      const cell=document.createElement('div');
      cell.className='meal-cell'+(val?' '+val:'');
      cell.textContent=val==='red'?'🔴':val==='yellow'?'🟡':val==='green'?'🟢':'';
      const di=i,mi=m.id; cell.onclick=()=>toggleMeal(mi,di); cells.appendChild(cell);
    }
    row.appendChild(em); row.appendChild(nm); row.appendChild(cells); c.appendChild(row);
  });
}
function renderWater() {
  const c=document.getElementById('water-rows'); if(!c) return; c.innerHTML='';
  const days=t().daysShort;
  for(let i=0;i<7;i++){
    const row=document.createElement('div'); row.className='water-day-row';
    const lbl=document.createElement('div'); lbl.className='water-day-lbl'; lbl.textContent=days[i];
    const cups=document.createElement('div'); cups.className='water-cups';
    const count=state.water[i]||0;
    for(let c2=0;c2<WATER_CUPS;c2++){
      const cup=document.createElement('div'); cup.className='water-cup'+(c2<count?' filled':''); cup.textContent='💧';
      const ci=c2,di=i; cup.onclick=()=>{state.water[di]=(state.water[di]===ci+1)?ci:ci+1;renderWater();autoSave();};
      cups.appendChild(cup);
    }
    const oz=document.createElement('div'); oz.className='water-oz'; oz.textContent=`${count*WATER_OZ}oz`;
    row.appendChild(lbl); row.appendChild(cups); row.appendChild(oz); c.appendChild(row);
  }
}
function renderStress() {
  const c=document.getElementById('stress-rows'); if(!c) return; c.innerHTML='';
  const days=t().daysShort; const levels=t().stressEmojis;
  for(let i=0;i<7;i++){
    const row=document.createElement('div'); row.className='stress-day-row';
    const lbl=document.createElement('div'); lbl.className='stress-day-lbl'; lbl.textContent=days[i];
    const btns=document.createElement('div'); btns.className='stress-btns';
    [0,1,2,3].forEach(v=>{
      const btn=document.createElement('button'); btn.className='stress-btn'+(state.stress[i]===v?' sel':''); btn.textContent=v;
      const vi=v,di=i; btn.onclick=()=>{state.stress[di]=state.stress[di]===vi?null:vi;renderStress();autoSave();};
      btns.appendChild(btn);
    });
    const word=document.createElement('div'); word.className='stress-word';
    word.textContent=state.stress[i]!==null?levels[state.stress[i]]:'';
    row.appendChild(lbl); row.appendChild(btns); row.appendChild(word); c.appendChild(row);
  }
}

function render() {
  const range=formatWeekRange(currentMonday);
  document.getElementById('week-subtitle').textContent=t().weekSubtitle(range);
  document.getElementById('week-title-reg').textContent=range;
  document.getElementById('week-title-graf').textContent=range;
  renderDayHeaders(); renderHabits(); renderMeals(); renderWater(); renderStress();
}

// ── Charts ───────────────────────────────────────────────
function calcDayPct(di) {
  let done=0,total=0;
  ALL_HABIT_DEFS.forEach(h=>{const v=(state.habits[h.id]||[])[di];if(v!==null){total++;if(v===true)done++;}});
  return total>0?Math.round(done/total*100):0;
}
function calcHabitPct(id) {
  let done=0,total=0;
  (state.habits[id]||[]).forEach(v=>{if(v!==null){total++;if(v===true)done++;}});
  return total>0?Math.round(done/total*100):0;
}
function calcPillarPct(pillar) {
  let score=0, total=0;
  (pillar.habits||[]).forEach(hid=>{
    (state.habits[hid]||[]).forEach(v=>{if(v!==null){total++;if(v===true)score++;}});
  });
  (pillar.meals||[]).forEach(mid=>{
    (state.meals[mid]||[]).forEach(v=>{
      if(v){total++;if(v==='green')score+=1;else if(v==='yellow')score+=0.5;}
    });
  });
  return total>0?Math.round(score/total*100):0;
}
function barColor(p){return p>=80?'#3cb37a':p>=50?'#e8a020':'#e05070';}

function renderCharts() {
  const l=t();
  const days=l.days;
  const pcts=days.map((_,i)=>calcDayPct(i));
  const avg=Math.round(pcts.reduce((a,b)=>a+b,0)/7);
  const best=Math.max(...pcts);
  const prayerDone=(state.habits['oracion']||[]).filter(v=>v===true).length;
  const waterVals=days.map((_,i)=>(state.water[i]||0)*WATER_OZ);
  const waterAvg=Math.round(waterVals.reduce((a,b)=>a+b,0)/7);
  let greenMeals=0,totalMeals=0;
  MEAL_DEFS.forEach(m=>{(state.meals[m.id]||[]).forEach(v=>{if(v){totalMeals++;if(v==='green')greenMeals++;}});});
  const mealQualityPct=totalMeals>0?Math.round(greenMeals/totalMeals*100):0;

  // Metric cards
  document.getElementById('metric-cards').innerHTML=`
    <div class="metric"><div class="metric-val">${avg}%</div><div class="metric-lbl">${l.metaAvg}</div></div>
    <div class="metric"><div class="metric-val">${best}%</div><div class="metric-lbl">${l.metaBest}</div></div>
    <div class="metric"><div class="metric-val">${prayerDone}/7</div><div class="metric-lbl">${l.metaPrayer}</div></div>
    <div class="metric"><div class="metric-val">${waterAvg}oz</div><div class="metric-lbl">${l.metaWater}</div></div>
    <div class="metric"><div class="metric-val">${mealQualityPct}%</div><div class="metric-lbl">${l.metaMeals}</div></div>
  `;

  // Daily bars
  const db=document.getElementById('daily-bars'); db.innerHTML='';
  pcts.forEach((p,i)=>{
    db.innerHTML+=`<div class="bar-row">
      <div class="bar-lbl">${days[i]}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${barColor(p)};"></div></div>
      <div class="bar-pct">${p}%</div>
    </div>`;
  });

  // Per habit bars
  const hb=document.getElementById('habit-bars'); hb.innerHTML='';
  ALL_HABIT_DEFS.forEach(h=>{
    const pct=calcHabitPct(h.id); const name=l.habits[h.id]||h.id;
    hb.innerHTML+=`<div class="hbar-row">
      <div class="hbar-lbl">${h.emoji} ${name}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%;background:${barColor(pct)};"></div></div>
      <div class="hbar-pct">${pct}%</div>
    </div>`;
  });

  // Pillars of Health
  const pb=document.getElementById('pillar-bars'); pb.innerHTML='';
  PILLAR_DEFS.forEach(pillar=>{
    const pct=calcPillarPct(pillar); const name=l.pillars[pillar.key]||pillar.key;
    pb.innerHTML+=`<div class="pillar-row">
      <div class="pillar-lbl">${name}</div>
      <div class="pillar-track"><div class="pillar-fill" style="width:${pct}%;background:${barColor(pct)};"></div></div>
      <div class="pillar-pct">${pct}%</div>
    </div>`;
  });

  // Water chart
  if(waterChart){waterChart.destroy();waterChart=null;}
  const wCtx=document.getElementById('water-chart').getContext('2d');
  waterChart=new Chart(wCtx,{
    type:'bar',
    data:{
      labels:days.map((d,i)=>{const dt=new Date(currentMonday);dt.setDate(dt.getDate()+i);return `${d} ${dt.getDate()}`;}),
      datasets:[{data:waterVals,backgroundColor:waterVals.map(v=>v>=WATER_GOAL?'#3cb37a':'#e07090'),borderRadius:5,borderSkipped:false}]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>l.waterTooltip(ctx.raw)}}},
      scales:{
        x:{grid:{display:false},ticks:{color:'#b09aaa',font:{size:10}}},
        y:{min:0,max:WATER_GOAL+20,grid:{color:'rgba(192,96,144,0.08)'},ticks:{color:'#b09aaa',font:{size:10},callback:v=>`${v}oz`}}
      }
    }
  });
  document.getElementById('water-note').textContent=l.waterGoalNote(WATER_GOAL);

  // Stress chart
  if(stressChart){stressChart.destroy();stressChart=null;}
  const sCtx=document.getElementById('stress-chart').getContext('2d');
  const stressVals=days.map((_,i)=>state.stress[i]);
  stressChart=new Chart(sCtx,{
    type:'line',
    data:{
      labels:days.map((d,i)=>{const dt=new Date(currentMonday);dt.setDate(dt.getDate()+i);return `${d} ${dt.getDate()}`;}),
      datasets:[{data:stressVals,borderColor:'#c06090',backgroundColor:'rgba(192,96,144,0.08)',borderWidth:2,pointBackgroundColor:'#c06090',pointRadius:5,tension:0.3,fill:true,spanGaps:true}]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.raw!==null?l.stressLevels[ctx.raw]:'—'}}},
      scales:{
        x:{grid:{display:false},ticks:{color:'#b09aaa',font:{size:10}}},
        y:{min:0,max:3,grid:{color:'rgba(192,96,144,0.08)'},ticks:{color:'#b09aaa',font:{size:10},stepSize:1}}
      }
    }
  });
  const filled=stressVals.filter(v=>v!==null);
  if(filled.length>=2){
    const first=filled[0],last=filled[filled.length-1];
    document.getElementById('stress-note').textContent=first>last?l.stressDown(first,last):first<last?l.stressUp(first,last):l.stressStable(first);
  } else { document.getElementById('stress-note').textContent=''; }

  // Meals breakdown (desglose por comida — no stacked chart)
  const bd=document.getElementById('meals-breakdown'); bd.innerHTML='';
  let totalG=0,totalY=0,totalR=0;
  MEAL_DEFS.forEach(m=>{
    const vals=state.meals[m.id]||[]; let r=0,y=0,g=0;
    vals.forEach(v=>{if(v==='red')r++;else if(v==='yellow')y++;else if(v==='green')g++;});
    totalG+=g; totalY+=y; totalR+=r;
    const total=r+y+g;
    const rP=total>0?r/total*100:0,yP=total>0?y/total*100:0,gP=total>0?g/total*100:0;
    const name=l.meals[m.id]||m.id;
    bd.innerHTML+=`<div class="meal-bd-row">
      <div class="meal-bd-lbl">${m.emoji} ${name}</div>
      <div class="meal-bd-track">
        <div class="meal-bd-seg" style="width:${gP}%;background:#3cb37a;"></div>
        <div class="meal-bd-seg" style="width:${yP}%;background:#e8a020;"></div>
        <div class="meal-bd-seg" style="width:${rP}%;background:#e05070;"></div>
      </div>
    </div>`;
  });
  const totalRated=totalG+totalY+totalR;
  document.getElementById('meals-note').textContent=totalRated>0?l.mealsRated(totalG,totalY,totalR,totalRated):l.mealsEmpty;

  // Insight cards
  let bestH=null,worstH=null,bestDayIdx=0; let bPct=-1,wPct=101;
  ALL_HABIT_DEFS.forEach(h=>{const p=calcHabitPct(h.id);if(p>bPct){bPct=p;bestH=h;}if(p<wPct){wPct=p;worstH=h;}});
  pcts.forEach((p,i)=>{if(p>pcts[bestDayIdx])bestDayIdx=i;});
  const bDate=new Date(currentMonday); bDate.setDate(bDate.getDate()+bestDayIdx);
  document.getElementById('insight-cards').innerHTML=`
    <div class="insight-card green"><div class="ic-emoji">🏆</div><div class="ic-lbl">${l.insightBest}</div><div class="ic-val">${bestH?bestH.emoji+' '+(l.habits[bestH.id]||bestH.id):'—'}</div></div>
    <div class="insight-card pink"><div class="ic-emoji">💪</div><div class="ic-lbl">${l.insightWorst}</div><div class="ic-val">${worstH?worstH.emoji+' '+(l.habits[worstH.id]||worstH.id):'—'}</div></div>
    <div class="insight-card gold"><div class="ic-emoji">⭐</div><div class="ic-lbl">${l.insightDay}</div><div class="ic-val">${days[bestDayIdx]} ${bDate.getDate()} ${l.months[bDate.getMonth()]}</div></div>
  `;
}

// ── Init ─────────────────────────────────────────────────
try {
  lang = detectLang();
  applyLang();
  renderLangBtns();

  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.navigator.standalone){
    const ib=document.getElementById('install-banner');
    if(ib) ib.style.display='block';
  }

  const _profiles=getProfiles();
  if(_profiles.length===0){ showProfileScreen(); }
  else if(_profiles.length===1){ selectProfile(_profiles[0]); }
  else { showProfileScreen(); }
} catch(e) {
  console.error('Init error:', e);
  showProfileScreen();
}
</script>
